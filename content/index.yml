    - src: "/images/home/gallery/gallery-5.png"
      alt: "Café Prana interior and food detail 5"
story:
  icon: "i-lucide-book-open"
  title: "My Story"
  description: "Founded by a yogini, nutritionist, foodie, nature lover, fitness trainer, health cook, and barista (...you get the persona...) who wanted to bring the holistic aspects of health and energy under one roof, Café Prana is a one-woman show that combines a welcoming atmosphere with high-quality sourcing. Regional, seasonal vegetables meet nutritious pseudocereals and natural superfoods under the creative touch of the kitchen fairy. Whether you're grabbing a specialty coffee to go or settling into the cushions for brunch, it is a safe and open space awaiting you. Prana's long-term goal is to implement even more sustainable practices and foster a sense of community and profound respect."
  image:
    src: "/images/home/my-story.png"
    alt: "Founder story image for Café Prana"
testimonials:
  icon: "i-lucide-star"
  title: "What My Guests Say"
  description: "Don't just take my word for it, hear from people who love Café Prana."
  cta:
    label: "Review me on Google"
    to: "https://search.google.com/local/writereview?placeid=ChIJqaIrmrRPqEcR3uE53IvR5qI"
    icon: "i-lucide-map"
    color: "primary"
    target: "_blank"
  items:
    - rating: 5
      quote: "Excellent service and friendly staff. Highly recommended!"
      author: "Alice Smith"
      relativeTime: "2 days ago"
    - rating: 4
      quote: "Great experience overall, but the wait time was a bit long."
      author: "Bob Johnson"
      relativeTime: "3 days ago"
    - rating: 5
      quote: "Absolutely loved it! Will come back for sure."
      author: "Charlie Lee"
      relativeTime: "4 days ago"
faq:
  icon: "i-lucide-circle-help"
  title: "Frequently Asked Questions"
  description: "Have a question? I've got answers."
  items:
    - label: "Is everything on the menu gluten-free?"
      content: "Yes! I am entirely gluten-free. All of my dishes are prepared without gluten so you can enjoy your meal worry-free."
    - label: "Do you take reservations?"
      content: "At the moment I accept reservations only via Instagram or email. Feel free to drop by. There's usually a seat waiting for you!"
    - label: "Are pets allowed?"
      content: "I currently do not allow animals indoors to ensure the comfort and safety of all my guests, including those with allergies or fears. Additionally, my shared space and open kitchen setup are not compatible with animals for hygiene reasons. Thank you for understanding!"
    - label: "Do you offer take-away?"
      content: "Yes, I offer take-away for most of my menu items. Stop by and ask me for details."
