locale: "en"
title: "Café Prana"
description: "A gluten-free and vegan haven in the heart of Berlin"
seo:
  title: "Café Prana"
  description: "Café Prana in Berlin offers a 100% gluten-free, vegan, organic menu in a cozy community space. Enjoy nourishing brunches, warm drinks, and a welcoming atmosphere."
  ogImage: "/images/hero.png"
hero:
  headline: "Newly opened!"
  title: "Welcome to Café Prana"
  description: "A gluten-free and vegan haven in the heart of Berlin"
  image:
    src: "/images/hero.png"
    alt: "Café Prana table with nourishing gluten-free and vegan food"
  links:
    - label: "Menu Highlights"
      to: "#menu"
      icon: "i-lucide-sparkles"
      color: "primary"
      size: "xl"
    - label: "Get Directions"
      to: "#directions"
      icon: "i-lucide-map"
      color: "neutral"
      variant: "outline"
      size: "xl"
philosophy:
  icon: "i-lucide-leaf"
  title: "My Philosophy"
  description: "I believe in nourishing food that delights your taste buds and fuels your body. Here's what makes Café Prana special:"
  features:
    - title: "100% Gluten-Free"
      description: "Everything on my menu is gluten-free, safe for coeliacs and those with sensitivities."
      icon: "i-lucide-wheat-off"
    - title: "Plant-Based & Organic"
      description: "I use plant-based, organic ingredients sourced locally whenever possible."
      icon: "i-lucide-sprout"
    - title: "Nourishing Lunch & Brunch"
      description: "My homemade dishes are created to fuel your body with a wide array of macro- and micronutrients."
      icon: "i-lucide-salad"
    - title: "Cozy Community Space"
      description: "Experience a warm atmosphere where you can relax, work or catch up with friends."
      icon: "i-lucide-hand-heart"
    - title: "Heartwarming Drinks"
      description: "Whether you opt for a latte with homemade cashew mylk or a seasonal hottie, your heart and mind will thank you."
      icon: "i-lucide-coffee"
    - title: "Immersive Experience"
      description: "At Prana, various spots will pop up where you can express yourself. Workshops are welcome!"
      icon: "i-lucide-users-round"
menu:
  icon: "i-lucide-utensils"
  title: "Menu Highlights"
  description: "Here are a few of my favourite dishes and drinks you can enjoy every day."
  items:
    - title: "Savoury Waffle"
      description: "Sweet potato waffle with Prana's savoury toppings of the day."
      image:
        src: "/images/menu/herzhafte-waffel.png"
        alt: "Savoury waffle with colourful plant-based toppings"
    - title: "Chai Latte"
      description: "A warming, homemade chai spice blend crafted with care and served with your choice of plant-based milk."
      image:
        src: "/images/menu/chai-latte.png"
        alt: "Chai latte in a ceramic cup"
    - title: "Ceremonial Cacao"
      description: "Yes, I believe in mindfulness and the power of pure, raw cacao to uplift your spirit."
      image:
        src: "/images/menu/cacao.png"
        alt: "Ceremonial cacao drink"
    - title: "Prana's Banana Bread"
      description: "Very nourishing and sweetened banana bread, served with seasonal toppings like nut butter or compote."
      image:
        src: "/images/menu/banana-bread.png"
        alt: "Slice of Prana banana bread with toppings"
  links:
    - label: "Explore the full menu"
      to: "/menu"
      icon: "i-lucide-utensils"
      color: "primary"
      size: "xl"
    - label: "Book a table"
      to: "/reservations"
      icon: "i-lucide-calendar-check"
      color: "neutral"
      variant: "outline"
      size: "xl"
events:
  headline: "Celebratory Events"
  icon: "i-lucide-party-popper"
  title: "Community gatherings"
  description: "At Prana, I bring people together around nourishing food, shared tables, and mindful moments. From regular community meals to special occasions, my space is designed for connection, celebration, and ease."
  image:
    src: "/images/events/index.png"
    alt: "Community event at Café Prana"
  features:
    - title: "Regular community events"
      description: "Regular gatherings like breakfast, brunch, and dinner, created to enjoy nourishing food and relaxed moments together."
      icon: "i-lucide-utensils"
    - title: "Special events and celebrations"
      description: "Seasonal dinners, themed evenings, and unique community gatherings that mark special moments throughout the year."
      icon: "i-lucide-calendar-days"
    - title: "Private bookings and custom events"
      description: "Book my space for your own celebration, workshop, or gathering, with optional catering from my plant based kitchen."
      icon: "i-lucide-party-popper"
  links:
    - label: "Explore all events"
      to: "/events"
      icon: "i-lucide-party-popper"
      color: "primary"
      size: "xl"
    - label: "Reserve your seat"
      to: "/reservations"
      icon: "i-lucide-calendar-check"
      color: "neutral"
      variant: "outline"
      size: "xl"
gallery:
  icon: "i-lucide-camera"
  title: "Gallery"
  description: "Get a glimpse of the ambience, dishes and drinks that convey Café Prana's philosophy."
  images:
