# Opening hours shown on the homepage in both languages and published to
# search engines as structured data. Day names are translated in code, so this
# one file keeps English and German identical by construction.
#
# `day` is one of monday ... sunday. Times are 24-hour `HH:MM`, in 15-minute
# steps. A closed day needs only `closed: true`.
#
# These hours are what the site *displays*. What can be *reserved* is separate,
# because events regularly run outside them: the booking days and times live in
# `shared/utils/reservations.ts` and only a developer can change them. Changing
# a closing day here means changing it there too.
hours:
  - day: monday
    closed: true
  - day: tuesday
    opens: '07:30'
    closes: '16:00'
  - day: wednesday
    opens: '07:30'
    closes: '15:00'
  - day: thursday
    opens: '07:30'
    closes: '15:00'
  - day: friday
    opens: '07:30'
    closes: '15:00'
  - day: saturday
    opens: '09:00'
    closes: '17:00'
  - day: sunday
    opens: '09:00'
    closes: '17:00'
