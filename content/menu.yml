      icon: "i-lucide-coffee"
      color: "primary"
    - label: "Hot Drinks"
      to: "#drinksHot"
      icon: "i-lucide-cup-soda"
      color: "neutral"
      variant: "outline"
    - label: "Food & Brunch"
      to: "#food"
      icon: "i-lucide-utensils"
      color: "neutral"
      variant: "outline"
categories:
  - id: drinksCoffee
