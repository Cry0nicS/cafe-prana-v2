locale: "de"
title: "Cafe Prana"
description: "Ein glutenfreies und veganes Café im Herzen von Berlin"
seo:
  title: "Cafe Prana Berlin | Glutenfreies veganes Cafe & Brunch"
  description: "Besuche Cafe Prana in Berlin Prenzlauer Berg fuer 100% glutenfreien veganen Brunch, Bio-Lunch, Specialty Coffee, warme Drinks und Community-Events."
  ogImage: "/images/hero.png"
hero:
  headline: "Neu eröffnet!"
  title: "Willkommen im Cafe Prana"
  description: "Ein glutenfreies und veganes Café im Herzen von Berlin"
  image:
    src: "/images/hero.png"
    alt: "Cafe-Prana-Tisch mit nährendem glutenfreiem und veganem Essen"
  links:
    - label: "Menü-Highlights"
      to: "#menu"
      icon: "i-lucide-sparkles"
      color: "primary"
      size: "xl"
    - label: "Anfahrt"
      to: "#directions"
      icon: "i-lucide-map"
      color: "neutral"
      variant: "outline"
      size: "xl"
philosophy:
  icon: "i-lucide-leaf"
  title: "Meine Philosophie"
  description: "Ich glaube an nährendes Essen, das gut schmeckt und Körper und Geist stärkt. Das macht Cafe Prana besonders:"
  features:
    - title: "100% glutenfrei"
      description: "Alles auf meiner Karte ist glutenfrei und damit auch für Menschen mit Zöliakie oder Sensitivitäten geeignet."
      icon: "i-lucide-wheat-off"
    - title: "Pflanzlich & Bio"
      description: "Ich verwende pflanzliche Bio-Zutaten und beziehe sie, wann immer möglich, regional."
      icon: "i-lucide-sprout"
    - title: "Nährender Lunch & Brunch"
      description: "Meine hausgemachten Gerichte versorgen dich mit vielen Makro- und Mikronährstoffen."
      icon: "i-lucide-salad"
    - title: "Gemütlicher Community-Space"
      description: "Ein warmer Ort zum Entspannen, Arbeiten oder Treffen mit Freundinnen und Freunden."
      icon: "i-lucide-hand-heart"
    - title: "Wärmende Getränke"
      description: "Ob Latte mit hausgemachter Cashew-Mylk oder saisonaler Hottie: Herz und Kopf dürfen aufatmen."
      icon: "i-lucide-coffee"
    - title: "Raum für Erlebnisse"
      description: "Bei Prana entstehen kleine Räume für Ausdruck, Begegnung und Workshops."
      icon: "i-lucide-users-round"
menu:
  icon: "i-lucide-utensils"
  title: "Menü-Highlights"
  description: "Eine Auswahl meiner liebsten Gerichte und Getränke, die du regelmäßig genießen kannst."
  items:
    - title: "Herzhafte Waffel"
      description: "Süßkartoffel-Waffel mit Pranas herzhaften Toppings des Tages."
      image:
        src: "/images/menu/herzhafte-waffel.png"
        alt: "Herzhafte Waffel mit bunten pflanzlichen Toppings"
    - title: "Chai Latte"
      description: "Hausgemachte Chai-Gewürzmischung, liebevoll zubereitet und mit Pflanzenmilch deiner Wahl serviert."
      image:
        src: "/images/menu/chai-latte.png"
        alt: "Chai Latte in einer Keramiktasse"
    - title: "Zeremonieller Kakao"
      description: "Reiner, roher Kakao für achtsame Momente und ein warmes Herz."
      image:
        src: "/images/menu/cacao.png"
        alt: "Zeremonieller Kakao"
    - title: "Pranas Banana Bread"
      description: "Nährendes, natürlich gesüßtes Banana Bread mit saisonalen Toppings wie Nussmus oder Kompott."
      image:
        src: "/images/menu/banana-bread.png"
        alt: "Scheibe Prana Banana Bread mit Toppings"
  links:
    - label: "Vollständiges Menü entdecken"
      to: "/menu"
      icon: "i-lucide-utensils"
      color: "primary"
      size: "xl"
    - label: "Tisch reservieren"
      to: "/reservations"
      icon: "i-lucide-calendar-check"
      color: "neutral"
      variant: "outline"
      size: "xl"
events:
  headline: "Besondere Events"
  icon: "i-lucide-party-popper"
  title: "Community Gatherings"
  description: "Bei Prana bringe ich Menschen an gemeinsamen Tischen zusammen: mit nährendem Essen, achtsamen Momenten und Raum für Verbindung."
  image:
    src: "/images/events/index.png"
    alt: "Community-Event im Cafe Prana"
  features:
    - title: "Regelmäßige Community-Events"
      description: "Frühstücke, Brunches und Dinner, bei denen wir nährendes Essen und entspannte Momente teilen."
      icon: "i-lucide-utensils"
    - title: "Saisonale Feiern"
      description: "Thematische Abende, saisonale Dinner und besondere Zusammenkünfte im Jahreslauf."
      icon: "i-lucide-calendar-days"
    - title: "Private Buchungen"
      description: "Buche den Raum für deine Feier, deinen Workshop oder dein Gathering, auf Wunsch mit Catering aus meiner pflanzlichen Küche."
      icon: "i-lucide-party-popper"
  links:
    - label: "Alle Events entdecken"
      to: "/events"
      icon: "i-lucide-party-popper"
      color: "primary"
      size: "xl"
    - label: "Platz reservieren"
      to: "/reservations"
      icon: "i-lucide-calendar-check"
      color: "neutral"
      variant: "outline"
      size: "xl"
gallery:
  icon: "i-lucide-camera"
  title: "Galerie"
  description: "Ein Eindruck von Atmosphäre, Gerichten und Getränken, die die Philosophie von Cafe Prana zeigen."
  images:
    - src: "/images/home/gallery/gallery-1.png"
      alt: "Cafe-Prana-Interior und Food-Detail 1"
    - src: "/images/home/gallery/gallery-2.png"
      alt: "Cafe-Prana-Interior und Food-Detail 2"
    - src: "/images/home/gallery/gallery-3.png"
      alt: "Cafe-Prana-Interior und Food-Detail 3"
    - src: "/images/home/gallery/gallery-4.png"
      alt: "Cafe-Prana-Interior und Food-Detail 4"
    - src: "/images/home/gallery/gallery-5.png"
      alt: "Cafe-Prana-Interior und Food-Detail 5"
story:
  icon: "i-lucide-book-open"
  title: "Meine Geschichte"
  description: "Gegründet von einer Yogini, Ernährungsberaterin, Foodie, Naturliebhaberin, Fitnesstrainerin, Gesundheitsköchin und Barista (...du verstehst die Richtung...), bringt Cafe Prana ganzheitliche Gesundheit und Energie unter ein Dach. Es ist eine One-Woman-Show, die warme Gastlichkeit mit hochwertiger, bewusster Auswahl verbindet. Regionale und saisonale Gemüse treffen auf nährende Pseudogetreide und natürliche Superfoods. Ob Specialty Coffee zum Mitnehmen oder ein gemütlicher Brunch auf den Kissen: Hier erwartet dich ein offener, sicherer Ort. Langfristig möchte Prana noch nachhaltiger werden und Community, Bewusstsein und Respekt weiter stärken."
  image:
    src: "/images/home/my-story.png"
    alt: "Gründerinnengeschichte von Cafe Prana"
testimonials:
  icon: "i-lucide-star"
  title: "Was meine Gäste sagen"
  description: "Nicht nur ich erzähle gern von Cafe Prana: Hier sind Stimmen von Menschen, die den Ort mögen."
  cta:
    label: "Auf Google bewerten"
    to: "https://search.google.com/local/writereview?placeid=ChIJqaIrmrRPqEcR3uE53IvR5qI"
    icon: "i-lucide-map"
    color: "primary"
    target: "_blank"
  items:
    - rating: 5
      quote: "Sehr freundlicher Service und eine warme Atmosphäre. Absolut empfehlenswert!"
      author: "Alice Smith"
      relativeTime: "vor 2 Tagen"
    - rating: 4
      quote: "Tolle Erfahrung insgesamt, nur die Wartezeit war etwas lang."
      author: "Bob Johnson"
      relativeTime: "vor 3 Tagen"
    - rating: 5
      quote: "Ich habe es geliebt und komme ganz sicher wieder."
      author: "Charlie Lee"
      relativeTime: "vor 4 Tagen"
faq:
  icon: "i-lucide-circle-help"
  title: "Häufige Fragen"
  description: "Du hast eine Frage? Hier findest du Antworten."
  items:
    - label: "Ist alles auf der Karte glutenfrei?"
      content: "Ja. Cafe Prana ist vollständig glutenfrei. Alle Gerichte werden ohne Gluten zubereitet."
    - label: "Kann ich reservieren?"
      content: "Ja, du kannst über das Reservierungsformular eine Anfrage senden. Ich bestätige die Verfügbarkeit anschließend per E-Mail."
    - label: "Sind Haustiere erlaubt?"
      content: "Aktuell sind drinnen keine Tiere erlaubt, damit sich alle Gäste wohl und sicher fühlen, besonders Menschen mit Allergien oder Ängsten. Auch der offene Küchenbereich ist aus hygienischen Gründen nicht für Tiere geeignet. Danke für dein Verständnis."
    - label: "Gibt es Take-away?"
      content: "Ja, viele Gerichte und Getränke gibt es auch zum Mitnehmen. Sprich mich einfach vor Ort an."
