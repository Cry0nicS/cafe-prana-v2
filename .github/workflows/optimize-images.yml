name: images

# Reports when anything under `public/images` is not in its optimised form.
#
# This used to run the optimiser and commit the result back, but a bot cannot
# push to `main`: the ruleset requires pull requests, and GitHub refuses to grant
# bypass to the GitHub Actions app on a user-owned repository. So the fix is
# applied by hand with `npm run optimize:images` and this job only tells you when
# it is needed, most likely after an upload through Studio.
#
# It fails rather than warns on purpose. A warning annotation leaves the run
# green and sends no notification, so an unoptimised upload would sit unnoticed.
# This is not a required status check, so a red run here never blocks a merge.

on:
  push:
    paths:
      - 'public/images/**'
      - 'scripts/optimize-images.mjs'
      - '.github/workflows/optimize-images.yml'
  pull_request:
    paths:
      - 'public/images/**'
      - 'scripts/optimize-images.mjs'
      - '.github/workflows/optimize-images.yml'

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The optimiser rewrites files in place, so a dirty tree is the signal. The
      # comparison is scoped to the paths it actually touches (the images plus
      # the files that reference them), so an unrelated write from `npm ci` or a
      # postinstall step cannot masquerade as an unoptimised image.
      - name: Check images are optimised
        run: |
          npm run optimize:images

          DIRTY=$(git status --porcelain -- public/images content app shared server test)

          if [ -z "$DIRTY" ]; then
            echo 'All images are already optimised.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '## Images need optimising'
            echo ''
            echo 'Run `npm run optimize:images` locally and commit the result.'
            echo ''
            echo '```'
            echo "$DIRTY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '::error::Unoptimised images committed. Run `npm run optimize:images` and commit the result.'
          exit 1
