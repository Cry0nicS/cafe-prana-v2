name: images

# Reports when anything under `public/images` is not in its optimised form.
#
# Nothing here blocks or fixes anything. The production build runs the same
# pass itself (see `modules/optimize-images.ts`), so an unoptimised upload can
# no longer reach the deployed site and there is nothing left for this job to
# guard. It used to fail on drift, which meant every Studio upload produced a
# red run that only a manual `npm run optimize:images` could clear.
#
# It is kept for the one signal the build deliberately swallows: the pass exits
# non-zero when it cannot process a file, so this job goes red for an upload
# that defeats the encoder. The build leaves that file alone and deploys the
# original instead of failing. Drift, by contrast, is only reported.

on:
  push:
    paths:
      - 'public/images/**'
      - 'scripts/optimize-images.mjs'
      - 'modules/optimize-images.ts'
      - '.github/workflows/optimize-images.yml'
  pull_request:
    paths:
      - 'public/images/**'
      - 'scripts/optimize-images.mjs'
      - 'modules/optimize-images.ts'
      - '.github/workflows/optimize-images.yml'

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The optimiser rewrites files in place, so a dirty tree is the signal. The
      # comparison is scoped to the paths it actually touches (the images plus
      # the files that reference them), so an unrelated write from `npm ci` or a
      # postinstall step cannot masquerade as an unoptimised image.
      - name: Check images are optimised
        run: |
          npm run optimize:images

          DIRTY=$(git status --porcelain -- public/images content app shared server test)

          if [ -z "$DIRTY" ]; then
            echo 'All images are already optimised.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '## Images are not in their optimised form'
            echo ''
            echo 'The build normalises them anyway, so the deployed site is fine.'
            echo 'To settle the committed files, run `npm run optimize:images` locally and commit the result.'
            echo ''
            echo '```'
            echo "$DIRTY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '::notice::Committed images are not in their optimised form. The build normalises them; run `npm run optimize:images` to settle the files.'
